name: Build all OpenWrt architectures

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Makefile', 'src/**', 'root/**', 'htdocs/**', 'po/**', 'scripts/**', 'tests/**', '.github/workflows/build-release.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      ipk_version:
        description: 'OpenWrt IPK SDK release'
        default: '24.10.5'
        type: string
      apk_version:
        description: 'OpenWrt APK SDK release'
        default: '25.12.4'
        type: string
      agent_tag:
        description: 'Agent tag; empty selects the latest official release'
        default: ''
        type: string
      architectures:
        description: 'Optional comma-separated package ABIs; empty builds ALL'
        default: ''
        type: string
      publish:
        description: 'Publish a full build as a GitHub release'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate sources and discover supported SDKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      agent_tag: ${{ steps.matrix.outputs.agent_tag }}
      agent_commit: ${{ steps.agent.outputs.commit }}
      legacy_source: ${{ steps.matrix.outputs.legacy_source }}
      package_version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Check sources and regression tests
        run: bash scripts/check_sources.sh
      - name: Read package version
        id: package
        run: |
          set -euo pipefail
          version="$(awk -F ':=' '/^PKG_VERSION:=/ { print $2; exit }' Makefile | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Pin the official Agent release and source commit
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_TAG: ${{ inputs.agent_tag }}
        run: |
          set -euo pipefail
          mkdir -p build-plan
          if [[ -n "$AGENT_TAG" ]]; then
            [[ "$AGENT_TAG" =~ ^v[0-9][A-Za-z0-9_.+-]*$ ]]
            gh api "repos/nezhahq/agent/releases/tags/$AGENT_TAG" > build-plan/agent-release.json
          else
            gh api repos/nezhahq/agent/releases/latest > build-plan/agent-release.json
          fi
          tag="$(jq -er .tag_name build-plan/agent-release.json)"
          [[ "$tag" =~ ^v[0-9][A-Za-z0-9_.+-]*$ ]]
          commit="$(gh api "repos/nezhahq/agent/commits/$tag" --jq .sha)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Generate the complete package ABI matrix
        id: matrix
        env:
          IPK_VERSION: ${{ inputs.ipk_version || '24.10.5' }}
          APK_VERSION: ${{ inputs.apk_version || '25.12.4' }}
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          python3 scripts/build_matrix.py \
            --ipk-version "$IPK_VERSION" --apk-version "$APK_VERSION" \
            --architectures "$ARCHITECTURES" \
            --agent-release build-plan/agent-release.json --output build-plan/build-plan.json
      - uses: actions/upload-artifact@v6
        with:
          name: build-plan
          path: build-plan/
          retention-days: 14

  agent:
    name: Prepare verified Agent binaries
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: build-plan
          path: build-plan
      - name: Check out pinned Agent source for legacy CPUs
        if: needs.prepare.outputs.legacy_source == 'true'
        uses: actions/checkout@v5
        with:
          repository: nezhahq/agent
          ref: ${{ needs.prepare.outputs.agent_commit }}
          path: agent-source
          persist-credentials: false
      - name: Install the Go toolchain required by the pinned Agent
        if: needs.prepare.outputs.legacy_source == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: agent-source/go.mod
          cache-dependency-path: agent-source/go.sum
      - name: Verify official binaries and build ARMv5 / soft-float x86
        env:
          AGENT_COMMIT: ${{ needs.prepare.outputs.agent_commit }}
        run: |
          python3 scripts/prepare_agent.py --plan build-plan/build-plan.json \
            --source-commit "$AGENT_COMMIT" --source-dir agent-source --output prepared-agent
      - uses: actions/upload-artifact@v6
        with:
          name: prepared-agent
          path: prepared-agent/
          compression-level: 0
          retention-days: 7

  build:
    name: ${{ matrix.format }} / ${{ matrix.arch }}
    needs: [prepare, agent]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: prepared-agent
          path: prepared-agent
      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio device-tree-compiler file flex gawk \
            gcc-multilib g++-multilib gettext git gperf help2man intltool \
            libelf-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            libyaml-dev libz-dev lld llvm make ninja-build patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            rsync swig tar unzip wget xmlto xxd zlib1g-dev zstd
      - name: Compile main and Chinese packages using the matching SDK
        env:
          JOB_JSON: ${{ toJSON(matrix) }}
        run: |
          export NEZHA_BUILD_RELEASE="$((GITHUB_RUN_NUMBER + 1))"
          bash scripts/build_sdk.sh
      - uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.id }}
          path: upload/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Verify completeness and publish
    needs: [prepare, agent, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: build-plan
          path: build-plan
      - name: Require every planned package and generate checksums
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          python3 scripts/collect_release.py --plan build-plan/build-plan.json --directory dist \
            --package-version "$PACKAGE_VERSION" --revision "$((GITHUB_RUN_NUMBER + 1))"
      - uses: actions/upload-artifact@v6
        with:
          name: all-packages-${{ needs.prepare.outputs.package_version }}-${{ github.run_number }}
          path: dist/*
          compression-level: 0
          retention-days: 30
      - name: Publish the complete build as a GitHub release
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish) &&
          inputs.architectures == ''
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_TAG: ${{ needs.prepare.outputs.agent_tag }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          set -euo pipefail
          release_tag="build-${PACKAGE_VERSION}-agent-${AGENT_TAG}-${GITHUB_RUN_NUMBER}"
          mapfile -d '' files < <(find dist -maxdepth 1 -type f -print0)
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${files[@]}" --clobber
          else
            gh release create "$release_tag" "${files[@]}" --target "$GITHUB_SHA" \
              --title "LuCI ${PACKAGE_VERSION} / Agent ${AGENT_TAG} / 全架构 IPK + APK" \
              --notes-file dist/release-notes.md --latest
          fi
